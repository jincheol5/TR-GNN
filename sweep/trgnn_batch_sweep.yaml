project: TRGNN
method: grid
name: trgnn_batch_train
command:
  - ${env}
  - ${interpreter}
  - -m
  - app.app_train
  - --app_num=1
  - --model=trgnn
  - --optimizer=adam
  - --epochs=100
  - --early_stop=1
  - --patience=10
  - --seed=1
  - --lr=0.0005
  - --latent_dim=32
  - --wandb=1
  - --save_model=1
  - ${args}            
parameters:
  batch_size:
    values: [4,8,32,64]
